family: "DTLS 1.3 wolfSSL interop Direction B"
requires:
  - wolfssl: true

# Direction B: wolfSSL server ↔ mbedtls client.
# wolfSSL server uses DTLS 1.3 (-u -v 4 -d -b -i).
# mbedtls client: server_addr=127.0.0.1 server_name=example.com
#   ca_file=$WOLFSSL_DIR/certs/ca-cert.pem
# wolfSSL cert SAN includes dNSName=example.com and iPAddress=127.0.0.1.

cases:
  - name: "B: full 1-RTT handshake"
    client:
      debug_level: 2
    expect:
      exit: 0
      assert:
        - wolfssl_server_dtls13_negotiated
        - client_dtls13_negotiated

  - name: "B: application data exchange"
    # wolfSSL server serves one request per connection; single exchange only.
    client:
      debug_level: 2
    expect:
      exit: 0
      assert:
        - wolfssl_server_dtls13_negotiated
        - client_dtls13_negotiated
        - client_read_server_data

  - name: "B: mbedtls client sends KeyUpdate (update_not_requested)"
    client:
      debug_level: 2
      key_update: 1
    expect:
      exit: 0
      assert:
        - wolfssl_server_dtls13_negotiated
        - client_dtls13_negotiated
        - client_key_update_sent
        - client_key_update_acked
        - client_key_update_outbound_installed
