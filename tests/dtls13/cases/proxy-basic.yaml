family: "DTLS 1.3"
requires:
  - config: MBEDTLS_SSL_PROTO_DTLS

cases:
  - name: "proxy - duplicate every packet"
    # wolfssl: assertions (epoch_record, no_resend) are mbedtls debug strings
    # not emitted by wolfSSL.
    skip_runners: [wolfssl]
    requires:
      - not_valgrind: true
    proxy:
      duplicate: 1
    server:
      dgram_packing: false
      debug_level: 2
      hs_timeout: [10000, 20000]
    client:
      dgram_packing: false
      debug_level: 2
      hs_timeout: [10000, 20000]
    expect:
      exit: 0
      assert:
        - client_epoch_record
        - server_epoch_record
        - server_no_resend
        - server_dtls13_negotiated
        - client_dtls13_negotiated

  - name: "proxy - duplicate every packet, anti-replay off"
    # wolfssl: anti_replay is an mbedtls-server param; assertions are mbedtls
    # debug strings.
    skip_runners: [wolfssl]
    proxy:
      duplicate: 1
    server:
      dgram_packing: false
      debug_level: 2
      anti_replay: 0
    client:
      dgram_packing: false
      debug_level: 2
    expect:
      exit: 0
      assert:
        - client_epoch_record
        - server_epoch_record
        - server_dtls13_negotiated
        - client_dtls13_negotiated

  - name: "proxy - multiple records in same datagram"
    # wolfssl: next_record_same_datagram is a mbedtls debug string.
    skip_runners: [wolfssl]
    proxy:
      pack: 50
    server:
      dgram_packing: false
      debug_level: 2
    client:
      dgram_packing: false
      debug_level: 2
    expect:
      exit: 0
      assert:
        - client_next_record_same_datagram
        - server_next_record_same_datagram

  - name: "proxy - multiple records in same datagram, duplicate every packet"
    skip_runners: [wolfssl]
    proxy:
      pack: 50
      duplicate: 1
    server:
      dgram_packing: false
      debug_level: 2
    client:
      dgram_packing: false
      debug_level: 2
    expect:
      exit: 0
      assert:
        - client_next_record_same_datagram
        - server_next_record_same_datagram

  - name: "proxy - inject invalid AD record, default badmac_limit"
    # wolfssl: bad_mac_discarded and badmac_limit are mbedtls debug strings
    # not emitted by wolfSSL.
    skip_runners: [wolfssl]
    client_time_factor: 4
    proxy:
      bad_ad: true
    server:
      dgram_packing: false
      debug_level: 1
      hs_timeout: [500, 10000]
    client:
      dgram_packing: false
      debug_level: 1
      hs_timeout: [500, 10000]
    expect:
      exit: 0
      assert:
        - client_bad_mac_discarded
        - server_bad_mac_discarded
        - server_no_badmac_limit
        - server_dtls13_negotiated
        - client_dtls13_negotiated
