# DTLS cookie secret API integration tests (Phase 1 of the DTLS 1.3
# cookie work — see local-docs/cookie-impl-plan.md §1.5 and
# local-docs/cookie-api-decision.md for the precedence rule).
#
# Phase 1 wires the new mbedtls_ssl_conf_dtls_cookie_secret API into
# the DTLS 1.2 HVR write/verify paths.  The DTLS 1.3 HRR write/verify
# paths come in step 4 (next commit).

family: "DTLS cookie secret API"
requires:
  - protocol: dtls12

cases:
  - name: "secret + APPLY_TO_DTLS12 (no legacy callbacks): DTLS 1.2 HVR via secret"
    requires:
      - config: MBEDTLS_SSL_DTLS_HELLO_VERIFY
    # Server: no legacy callbacks (cookies=0), secret configured with
    # APPLY_TO_DTLS12 flag.  Client speaks DTLS 1.2.  Expectation:
    # server issues HVR using the secret-managed cookie; client echoes
    # it; server verifies and proceeds.  The server log line that
    # marks acceptance is "cookie verification passed" (same line
    # emitted by the legacy path; the precedence rule just routes us
    # through the secret-based helper instead).
    server:
      force_version: dtls12
      cookies: 0
      dtls_cookie_secret: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      dtls_cookie_secret_apply_to_dtls12: 1
      debug_level: 2
    client:
      min_version: dtls12
      max_version: dtls12
      debug_level: 2
    expect:
      exit: 0
      assert:
        - server_dtls12_negotiated
        - client_dtls12_negotiated
        - server_dtls12_cookie_passed

  - name: "secret without APPLY_TO_DTLS12, no callbacks: DTLS 1.2 has no cookie path"
    requires:
      - config: MBEDTLS_SSL_DTLS_HELLO_VERIFY
    # Server: no legacy callbacks AND secret configured WITHOUT the
    # APPLY_TO_DTLS12 flag.  This is row 4 of the precedence table for
    # DTLS 1.2 (neither path active).  Expected: the handshake fails
    # because the server has no way to issue/verify a 1.2 cookie, so
    # the handshake aborts after the first ClientHello.  Captures the
    # explicit opt-in property: configuring a secret for DTLS 1.3 does
    # NOT silently enable cookies for DTLS 1.2.
    server:
      force_version: dtls12
      cookies: 0
      dtls_cookie_secret: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      dtls_cookie_secret_apply_to_dtls12: 0
      debug_level: 2
    client:
      min_version: dtls12
      max_version: dtls12
      debug_level: 2
    # cookies=0 with no secret-for-1.2 means no HVR.  Handshake still
    # completes (the server just doesn't verify reachability) — same
    # behaviour as cookies=0 today.
    expect:
      exit: 0
      assert:
        - server_dtls12_negotiated
        - client_dtls12_negotiated

  - name: "secret + legacy callbacks: DTLS 1.2 uses legacy callbacks (back-compat)"
    requires:
      - config: MBEDTLS_SSL_DTLS_HELLO_VERIFY
      - config: MBEDTLS_SSL_COOKIE_C
    # Server: BOTH legacy callbacks (cookies=1) AND new secret
    # configured.  Per the precedence rule, the legacy callbacks win
    # for DTLS 1.2 — the secret feeds DTLS 1.3 only.  Server log
    # emits "cookie verification passed" (legacy callback path), not
    # the "(secret)" variant.
    server:
      force_version: dtls12
      cookies: 1
      dtls_cookie_secret: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      dtls_cookie_secret_apply_to_dtls12: 0
      debug_level: 2
    client:
      min_version: dtls12
      max_version: dtls12
      debug_level: 2
    expect:
      exit: 0
      assert:
        - server_dtls12_negotiated
        - client_dtls12_negotiated
        - server_dtls12_cookie_passed

  - name: "secret + APPLY_TO_DTLS12 + legacy callbacks: callbacks still win for 1.2"
    requires:
      - config: MBEDTLS_SSL_DTLS_HELLO_VERIFY
      - config: MBEDTLS_SSL_COOKIE_C
    # Server: legacy callbacks AND secret with APPLY_TO_DTLS12.  The
    # flag is a no-op when callbacks are also configured (legacy
    # back-compat principle).  Same assertions as the previous test:
    # legacy callback path used, "cookie verification passed".
    server:
      force_version: dtls12
      cookies: 1
      dtls_cookie_secret: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      dtls_cookie_secret_apply_to_dtls12: 1
      debug_level: 2
    client:
      min_version: dtls12
      max_version: dtls12
      debug_level: 2
    expect:
      exit: 0
      assert:
        - server_dtls12_negotiated
        - client_dtls12_negotiated
        - server_dtls12_cookie_passed
