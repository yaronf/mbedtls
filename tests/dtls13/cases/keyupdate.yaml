family: "DTLS 1.3 KeyUpdate"
requires:
  - protocol: dtls13

cases:
  - name: "client sends KeyUpdate (update_not_requested)"
    skip_runners: [wolfssl]
    server:
      debug_level: 2
    client:
      debug_level: 2
      key_update: 1
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - client_key_update_sent
        - client_key_update_acked
        - client_key_update_outbound_installed
        - server_key_update_received
        - server_key_update_inbound_installed

  - name: "server sends KeyUpdate (update_not_requested)"
    skip_runners: [wolfssl]
    server:
      debug_level: 2
      key_update: 1
    client:
      debug_level: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_key_update_sent
        - server_key_update_acked
        - server_key_update_outbound_installed
        - client_key_update_received
        - client_key_update_inbound_installed

  - name: "client sends KeyUpdate (update_requested) — server reciprocates"
    skip_runners: [wolfssl]
    server:
      debug_level: 2
    client:
      debug_level: 2
      key_update: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - client_key_update_sent
        - server_key_update_received
        - server_key_update_sent
        - server_key_update_acked
        - server_key_update_outbound_installed
        - client_key_update_received
        - client_key_update_inbound_installed

  - name: "KeyUpdate followed by application data exchange"
    skip_runners: [wolfssl]
    server:
      debug_level: 2
      key_update: 1
      exchanges: 2
    client:
      exchanges: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_key_update_sent
        - server_key_update_acked
        - server_key_update_outbound_installed

  - name: "AEAD limit auto-triggers KeyUpdate on server"
    skip_runners: [wolfssl]
    # aead_limit=3: server triggers KeyUpdate automatically after 3 outbound
    # records on an epoch (well before the exchange count exhausts them).
    server:
      debug_level: 2
      aead_limit: 3
      exchanges: 4
    client:
      debug_level: 2
      exchanges: 4
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_aead_limit_triggered
        - server_key_update_sent
        - server_key_update_acked
        - server_key_update_outbound_installed
        - client_key_update_received
        - client_key_update_inbound_installed

  - name: "AEAD limit auto-triggers KeyUpdate on client"
    skip_runners: [wolfssl]
    server:
      debug_level: 2
      exchanges: 4
    client:
      debug_level: 2
      aead_limit: 3
      exchanges: 4
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - client_aead_limit_triggered
        - client_key_update_sent
        - client_key_update_acked
        - client_key_update_outbound_installed
        - server_key_update_received
        - server_key_update_inbound_installed

  - name: "KeyUpdate + duplicate: connection survives old-epoch duplicate records"
    # Regression test for RFC 9147 §4.2.1 per-epoch replay protection.
    # After KeyUpdate the old epoch's inbound transform is retained in the epoch
    # pool (for reorder tolerance).  Duplicate handshake records from the old
    # epoch arrive at the receiver after the epoch transition; the per-epoch
    # anti-replay window must correctly accept/reject them.
    # Without the per-epoch window fix, old-epoch records bypassed the replay
    # gate entirely (the global in_window only covers the current epoch).
    # Note: triggering "replayed old-epoch record" deterministically requires
    # delayed application-data replay across an epoch boundary; the duplicate=1
    # proxy only duplicates handshake records.  This case verifies the connection
    # completes correctly under duplication stress; unit-level pool-replay tests
    # cover the specific drop path.
    skip_runners: [wolfssl]
    requires:
      - not_valgrind: true
    proxy:
      duplicate: 1
    server:
      debug_level: 2
      key_update: 1
      exchanges: 2
      dgram_packing: false
      hs_timeout: [10000, 20000]
    client:
      debug_level: 2
      exchanges: 2
      dgram_packing: false
      hs_timeout: [10000, 20000]
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_key_update_sent
        - server_key_update_acked
        - server_key_update_outbound_installed
        - client_key_update_inbound_installed

  - name: "auth-fail limit: server closes after too many bad MACs"
    skip_runners: [wolfssl]
    # bad_ad proxy corrupts every ApplicationData record.
    # auth_fail_limit=1 on server → closes on the first bad inbound record.
    server:
      debug_level: 2
      auth_fail_limit: 1
      exchanges: 2
    client:
      debug_level: 2
      exchanges: 2
    proxy:
      bad_ad: true
    expect:
      exit: 1
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_auth_fail_limit_reached

  - name: "bad KeyUpdate: body too long triggers server decode_error"
    skip_runners: [wolfssl]
    # Client sends a 2-byte KeyUpdate body (valid is 1 byte).
    # Server must reject with decode_error and close the connection.
    server:
      debug_level: 2
    client:
      debug_level: 2
      bad_keyupdate: 1
    expect:
      exit: 1
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_keyupdate_bad_length

  - name: "bad KeyUpdate: invalid update_requested value triggers illegal_parameter"
    skip_runners: [wolfssl]
    # Client sends update_requested=2 (only 0 and 1 are valid per RFC 9147 §8).
    # Server must reject with illegal_parameter.
    server:
      debug_level: 2
    client:
      debug_level: 2
      bad_keyupdate: 2
    expect:
      exit: 1
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_keyupdate_invalid_update_requested

  - name: "double KeyUpdate: second blocked by pending-ACK guard"
    skip_runners: [wolfssl]
    # ssl_client2 sends two KeyUpdates back-to-back without waiting for ACK.
    # The second call must return WANT_WRITE (pending-ACK guard at ssl_msg.c:7515).
    # The ssl_client2 binary returns exit 0 if it gets the expected WANT_WRITE.
    server:
      debug_level: 2
    client:
      debug_level: 2
      double_keyupdate: 1
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
