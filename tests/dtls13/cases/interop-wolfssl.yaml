family: "DTLS 1.3 wolfSSL interop"
requires:
  - wolfssl: true

# Direction A only: mbedtls server ↔ wolfSSL client.
# Direction B (wolfSSL server ↔ mbedtls client) is not supported: wolfSSL 5.9.0
# DTLS 1.3 server silently drops mbedtls ClientHellos (protocol incompatibility).
#
# wolfSSL-specific cases for Direction A.
# These cases require wolfSSL-specific params or cert/key material that cannot
# be expressed using the shared mbedtls case params.

cases:
  - name: "A: PSK (psk_ephemeral) — wolfSSL hardcoded key"
    # wolfSSL --openssl-psk hardcodes identity="Client_identity" and a fixed
    # 32-byte key 0x01,0x23,... (wrapping at 0x100). The mbedtls test PSK
    # (abc123) is incompatible, so this case lives here separately.
    requires:
      - config: MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_PSK_EPHEMERAL_ENABLED
    server:
      psk: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      psk_identity: "Client_identity"
      debug_level: 2
    client:
      wolfssl_psk: true
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_psk_ephemeral

  - name: "A: HRR — wolfSSL client triggers HelloRetryRequest"
    # wolfSSL -J sends an empty KeyShare, forcing the server to send HRR.
    server:
      debug_level: 2
    client:
      wolfssl_hrr: true
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_hrr_sent

  - name: "A: reconnect after NewSessionTicket"
    # wolfSSL client -r reconnects after receiving a ticket but performs a full
    # handshake (doesn't use the ticket as a PSK — "didn't reuse session id").
    # We verify the server issues a ticket and the second connection succeeds.
    requires:
      - config: MBEDTLS_SSL_SESSION_TICKETS
    server:
      debug_level: 2
    client:
      wolfssl_resume: true
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_ticket_issued

  # NOTE: fragmentation (proxy MTU) is not included here because wolfSSL client
  # produces a "record layer version error" when receiving fragmented DTLS 1.3
  # records from mbedtls server. This is a wolfSSL limitation.
