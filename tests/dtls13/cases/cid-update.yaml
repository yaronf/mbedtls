family: "DTLS 1.3 CID update"
requires:
  - protocol: dtls13
  - config: MBEDTLS_SSL_DTLS_CONNECTION_ID

cases:
  - name: "CID update: server sends NewConnectionId, client receives and ACKs"
    # Server sends NewConnectionId(immediate) after handshake.
    # Client should receive it, update outbound CID, and send ACK.
    # Server should see its NewConnectionId acknowledged.
    server:
      debug_level: 3
      cid: 1
      cid_val: "deadbeef"
      send_new_cid: 1
      exchanges: 2
    client:
      debug_level: 3
      cid: 1
      cid_val: "cafebabe"
      exchanges: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - server_new_cid_sent
        - client_new_cid_received
        - server_new_cid_acked

  - name: "CID update: client sends NewConnectionId, server receives and ACKs"
    # Symmetric: client initiates a NewConnectionId update.
    server:
      debug_level: 3
      cid: 1
      cid_val: "deadbeef"
      exchanges: 2
    client:
      debug_level: 3
      cid: 1
      cid_val: "cafebabe"
      send_new_cid: 1
      exchanges: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - client_new_cid_sent
        - server_new_cid_received
        - client_new_cid_acked

  - name: "CID update: client requests new CID from server"
    # Client sends RequestConnectionId(1).
    # Server responds with NewConnectionId(spare).
    # Client receives it and ACKs.
    server:
      debug_level: 3
      cid: 1
      cid_val: "deadbeef"
      exchanges: 2
    client:
      debug_level: 3
      cid: 1
      cid_val: "cafebabe"
      request_cid: 1
      exchanges: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - client_req_cid_sent
        - server_req_cid_received
        - server_new_cid_sent
        - client_new_cid_received
        - server_new_cid_acked

  - name: "CID update: server requests new CID from client"
    # Symmetric: server sends RequestConnectionId(1).
    server:
      debug_level: 3
      cid: 1
      cid_val: "deadbeef"
      request_cid: 1
      exchanges: 2
    client:
      debug_level: 3
      cid: 1
      cid_val: "cafebabe"
      exchanges: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - server_req_cid_sent
        - client_req_cid_received
        - client_new_cid_sent
        - server_new_cid_received
        - client_new_cid_acked

  - name: "CID update: client rebinds socket (address migration)"
    # Client changes UDP source port mid-session to simulate NAT rebind / address change.
    # Server has allow_addr_migration=1: uses recvfrom on listen_fd, commits migration
    # after 1s silence from old address with at least one validated packet from new address.
    server:
      debug_level: 3
      cid: 1
      cid_val: "deadbeef"
      allow_addr_migration: 1
      migration_timeout_ms: 0
      exchanges: 999
      read_timeout: 5000
    client:
      debug_level: 3
      cid: 1
      cid_val: "cafebabe"
      cid_change_addr: 2
      exchanges: 4
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - client_addr_changed
        - server_addr_migrated

  - name: "CID update: client address change rejected by default server (no migration)"
    # Default server behavior: connected UDP socket filters by 5-tuple.
    # After client rebinds, datagrams from the new source are dropped by the kernel.
    # Client times out waiting for a reply; server times out waiting for more data.
    # Verifies that migration is opt-in and the default is safe.
    # Client exits non-zero (timeout); server exits 0 (clean timeout via read_timeout).
    server:
      debug_level: 3
      cid: 1
      cid_val: "deadbeef"
      exchanges: 999
      read_timeout: 5000
    client:
      debug_level: 3
      cid: 1
      cid_val: "cafebabe"
      cid_change_addr: 1
      exchanges: 4
      read_timeout: 3000
    expect:
      exit: 1
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - client_addr_changed
        - server_addr_not_migrated

  - name: "bad NewConnectionId: truncated body triggers server decode_error"
    skip_runners: [wolfssl]
    # Client sends a NewConnectionId with a 1-byte body (list_len field truncated).
    # Server must reject with decode_error and close the connection.
    server:
      debug_level: 2
      cid: 1
      cid_val: "deadbeef"
    client:
      debug_level: 2
      cid: 1
      cid_val: "cafebabe"
      bad_new_cid: 1
    expect:
      exit: 1
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - server_new_cid_not_accepted

  - name: "NewConnectionId: list_len=0 is accepted (RFC 9147 §9 — peer has no CIDs to offer)"
    skip_runners: [wolfssl]
    # Client sends a NewConnectionId with list_len=0.
    # RFC 9147 §9: an endpoint MAY respond with no CIDs at all; this is valid.
    # Server must accept the message and continue normally.
    server:
      debug_level: 2
      cid: 1
      cid_val: "deadbeef"
    client:
      debug_level: 2
      cid: 1
      cid_val: "cafebabe"
      bad_new_cid: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated

  - name: "bad NewConnectionId: cid_len too large triggers server illegal_parameter"
    skip_runners: [wolfssl]
    # Client sends a NewConnectionId with cid_len > MBEDTLS_SSL_CID_OUT_LEN_MAX.
    # Server must reject with illegal_parameter.
    server:
      debug_level: 2
      cid: 1
      cid_val: "deadbeef"
    client:
      debug_level: 2
      cid: 1
      cid_val: "cafebabe"
      bad_new_cid: 3
    expect:
      exit: 1
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - server_new_cid_not_accepted

  - name: "bad RequestConnectionId: empty body triggers server decode_error"
    skip_runners: [wolfssl]
    # Client sends a RequestConnectionId with 0-byte body (needs 1 byte for num_cids).
    # Server must reject with decode_error.
    server:
      debug_level: 2
      cid: 1
      cid_val: "deadbeef"
    client:
      debug_level: 2
      cid: 1
      cid_val: "cafebabe"
      bad_req_cid: 1
    expect:
      exit: 1
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - server_req_cid_not_accepted

  - name: "CID pool: NewConnectionId sends 2 CIDs"
    skip_runners: [wolfssl]
    # After handshake the server initialises a 2-entry inbound CID pool and
    # sends a NewConnectionId with both CIDs (IMMEDIATE + SPARE).
    # Client log must show it received 2 CIDs in the list.
    server:
      debug_level: 3
      cid: 1
      cid_val: "deadbeef"
      send_new_cid: 1
      exchanges: 2
    client:
      debug_level: 3
      cid: 1
      cid_val: "cafebabe"
      exchanges: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - server_new_cid_list_2
        - client_new_cid_received

  - name: "CID pool: client rotates own CID — server sees new CID in use"
    skip_runners: [wolfssl]
    # Client calls rotate_cids after 2 exchanges: promotes spare to active,
    # sends NewConnectionId(IMMEDIATE) with 2 CIDs.
    # Server receives it, switches outbound CID, ACKs.
    # Data exchange continues on the new CID.
    server:
      debug_level: 3
      cid: 1
      cid_val: "deadbeef"
      exchanges: 5
    client:
      debug_level: 3
      cid: 1
      cid_val: "cafebabe"
      rotate_cid: 2
      exchanges: 5
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - client_cid_rotated
        - server_new_cid_received
        - client_new_cid_acked

  - name: "CID pool: server rotates own CID — client sees new CID in use"
    skip_runners: [wolfssl]
    # Symmetric of the previous test: server rotates after 2 exchanges.
    server:
      debug_level: 3
      cid: 1
      cid_val: "deadbeef"
      rotate_cid: 2
      exchanges: 5
    client:
      debug_level: 3
      cid: 1
      cid_val: "cafebabe"
      exchanges: 5
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - server_cid_rotated
        - client_new_cid_received
        - server_new_cid_acked

  - name: "CID pool: rotate blocked by pending ACK (no-op guard)"
    skip_runners: [wolfssl]
    # Client calls rotate_cids after 2 exchanges, then send_new_cid=1 races
    # before the ACK arrives.  The second NewConnectionId must be a no-op.
    # Connection must remain healthy and exit cleanly.
    server:
      debug_level: 3
      cid: 1
      cid_val: "deadbeef"
      exchanges: 5
    client:
      debug_level: 3
      cid: 1
      cid_val: "cafebabe"
      rotate_cid: 2
      send_new_cid: 1
      exchanges: 5
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - client_cid_rotated

  - name: "CID pool: bad NewConnectionId with 2-entry list — second entry truncated"
    skip_runners: [wolfssl]
    # Client sends a NewConnectionId whose cids list length advertises 2 entries
    # but the second entry bytes are missing.  Server must reject with decode_error.
    server:
      debug_level: 2
      cid: 1
      cid_val: "deadbeef"
    client:
      debug_level: 2
      cid: 1
      cid_val: "cafebabe"
      bad_new_cid: 4
    expect:
      exit: 1
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_cid_negotiated
        - client_cid_negotiated
        - server_new_cid_not_accepted

  - name: "NewConnectionId timeout: server-initiated, client ACK lost"
    # Server sends NewConnectionId post-handshake; the proxy corrupts c2s
    # packets after the NST ACK has been received so the client's ACK of
    # the NCI is lost.  Server's NCI retransmit budget should exhaust
    # and TIMEOUT should propagate.
    #
    # Today this fails because mbedtls's NewConnectionId path uses
    # dtls13_pending_acks[] for ACK matching but no retransmit machinery —
    # same RFC 9147 §7 compliance gap as KeyUpdate.  See
    # local-docs/keyupdate-retransmit-plan.md (broad-scope fix covers
    # KU, NCI, and RCI symmetrically).
    #
    # Threshold set to 8 so c2s packets 1-8 (handshake + NST ACK + HTTP)
    # flow clean and the test exercises ONLY the NCI ACK path — not
    # NST_WAIT_ACK timeout (which is fixed in 46f89e8f2c).
    skip_runners: [wolfssl]
    proxy:
      corrupt_after_pkt: 8
      corrupt_dir: c2s
    server:
      hs_timeout: [100, 400]
      debug_level: 1
      cid: 1
      cid_val: "deadbeef"
      send_new_cid: 1
    client:
      hs_timeout: [100, 400]
      debug_level: 1
      cid: 1
      cid_val: "cafebabe"
    expect:
      exit: 1
      assert:
        - server_handshake_timeout
