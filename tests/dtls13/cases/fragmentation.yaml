family: "DTLS 1.3"
requires:
  - config: MBEDTLS_SSL_PROTO_DTLS
  - max_content_len: 2048

cases:
  - name: "fragmenting \u2014 proxy MTU"
    # wolfssl: uses mbedtls-specific cert chain files (crt_file/key_file) not
    # available to wolfSSL. wolfSSL client also gets "record layer version error"
    # when receiving fragmented DTLS 1.3 records (wolfSSL limitation).
    skip_runners: [wolfssl]
    proxy:
      mtu: 512
    server:
      dgram_packing: false
      debug_level: 2
      auth_mode: required
      crt_file: server7_int-ca.crt
      key_file: server7.key
      hs_timeout: [10000, 60000]
      mtu: 512
    client:
      dgram_packing: false
      debug_level: 2
      crt_file: server8_int-ca2.crt
      key_file: server8.key
      hs_timeout: [10000, 60000]
      mtu: 512
    expect:
      exit: 0
      assert:
        - server_fragmented_hs
        - client_fragmented_hs
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - client_no_error

  - name: "fragmenting \u2014 proxy MTU, nbio"
    skip_runners: [wolfssl]
    proxy:
      mtu: 512
    server:
      dgram_packing: false
      debug_level: 2
      auth_mode: required
      crt_file: server7_int-ca.crt
      key_file: server7.key
      hs_timeout: [10000, 60000]
      mtu: 512
      nbio: 2
    client:
      dgram_packing: false
      debug_level: 2
      crt_file: server8_int-ca2.crt
      key_file: server8.key
      hs_timeout: [10000, 60000]
      mtu: 512
      nbio: 2
    expect:
      exit: 0
      assert:
        - server_fragmented_hs
        - client_fragmented_hs
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - client_no_error
