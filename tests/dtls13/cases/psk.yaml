family: "DTLS 1.3 PSK"
requires:
  - protocol: dtls13
  - config: MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_PSK_EPHEMERAL_ENABLED

cases:
  - name: "external PSK, psk_ephemeral key exchange"
    # wolfssl: wolfSSL client uses a hardcoded PSK key/identity via --openssl-psk,
    # incompatible with the test PSK values here. Covered in interop-wolfssl.yaml.
    skip_runners: [wolfssl]
    server:
      psk: "abc123"
      psk_identity: "Client_identity"
      auth_mode: required
      debug_level: 2
    client:
      psk: "abc123"
      psk_identity: "Client_identity"
      debug_level: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_psk_ephemeral

  - name: "session resumption via NewSessionTicket PSK"
    # Full flow: cert-based handshake → server issues NST → client saves ticket →
    # client reconnects → server accepts resumed handshake via psk_ephemeral.
    # wolfssl: wolfSSL client -r reconnects but performs a full handshake (doesn't
    # use the ticket as a PSK), so psk_ephemeral assertion would fail.
    # Covered in interop-wolfssl.yaml.
    skip_runners: [wolfssl]
    requires:
      - config: MBEDTLS_SSL_SESSION_TICKETS
    server:
      debug_level: 2
    client:
      reconnect: 1
      skip_close_notify: true
      debug_level: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - client_got_ticket
        - client_reconnecting
        - server_psk_ephemeral

  - name: "PSK with cookie enabled — no HRR/cookie exchange (RFC 9147 §5.1)"
    # RFC 9147 §5.1: server MAY skip address validation when a valid PSK is
    # available. wolfSSL PSK uses hardcoded values, not compatible with this
    # test's psk/psk_identity params.
    skip_runners: [wolfssl]
    requires:
      - config: MBEDTLS_SSL_DTLS_HELLO_VERIFY
    server:
      psk: "abc123"
      psk_identity: "Client_identity"
      auth_mode: required
      cookies: 1
      debug_level: 2
    client:
      psk: "abc123"
      psk_identity: "Client_identity"
      debug_level: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_psk_ephemeral
        - client_no_hrr
        - server_no_cookie_verified
