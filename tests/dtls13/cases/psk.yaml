family: "DTLS 1.3 PSK"
requires:
  - protocol: dtls13
  - config: MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_PSK_EPHEMERAL_ENABLED

cases:
  - name: "external PSK, psk_ephemeral key exchange"
    # wolfssl: override server PSK to wolfSSL's hardcoded key/identity
    # (--openssl-psk uses 0x0123... key, identity="Client_identity").
    server:
      psk: "abc123"
      psk_identity: "Client_identity"
      debug_level: 2
    client:
      psk: "abc123"
      psk_identity: "Client_identity"
      debug_level: 2
    runner_overrides:
      wolfssl:
        server:
          psk: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          psk_identity: "Client_identity"
          debug_level: 2
        client:
          wolfssl_psk: true
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_psk_ephemeral

  - name: "session resumption via NewSessionTicket PSK"
    # Full flow: cert-based handshake → server issues NST → client saves ticket →
    # client reconnects → server accepts resumed handshake via psk_ephemeral.
    # wolfssl: wolfSSL client -r reconnects but performs a full handshake (doesn't
    # use the ticket as a PSK), so psk_ephemeral assertion would fail.
    # Covered in interop-wolfssl.yaml.
    skip_runners: [wolfssl]
    requires:
      - config: MBEDTLS_SSL_SESSION_TICKETS
    server:
      debug_level: 2
    client:
      reconnect: 1
      skip_close_notify: true
      debug_level: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - client_got_ticket
        - client_reconnecting
        - server_psk_ephemeral

  - name: "PSK-only key exchange mode (no ephemeral)"
    # Forces both endpoints into psk_only mode (no (EC)DHE).  PSK-only DTLS 1.3
    # is RFC-permissible but uncommon; this is the only test that covers it.
    # Exercises the path where offered_group_id == 0 in HVR handling
    # (ssl_tls13_client.c:2140) — without the SOME_EPHEMERAL_ENABLED guard
    # the call would fail with INTERNAL_ERROR.
    skip_runners: [wolfssl]
    requires:
      - config: MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_PSK_ENABLED
    server:
      psk: "abc123"
      psk_identity: "Client_identity"
      tls13_kex_modes: "psk"
      debug_level: 2
    client:
      psk: "abc123"
      psk_identity: "Client_identity"
      tls13_kex_modes: "psk"
      debug_level: 2
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_psk_only

  - name: "PSK with cookie enabled — no HRR/cookie exchange (RFC 9147 §5.1)"
    # RFC 9147 §5.1: server MAY skip address validation when a valid PSK is
    # available. Override server PSK to wolfSSL's hardcoded key for wolfssl runner.
    requires:
      - config: MBEDTLS_SSL_DTLS_HELLO_VERIFY
    server:
      psk: "abc123"
      psk_identity: "Client_identity"
      cookies: 1
      debug_level: 2
    client:
      psk: "abc123"
      psk_identity: "Client_identity"
      debug_level: 2
    runner_overrides:
      wolfssl:
        server:
          psk: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          psk_identity: "Client_identity"
          cookies: 1
          debug_level: 2
        client:
          wolfssl_psk: true
    expect:
      exit: 0
      assert:
        - server_dtls13_negotiated
        - client_dtls13_negotiated
        - server_psk_ephemeral
        - client_no_hrr
        - server_no_cookie_verified
