    string: "got new session ticket (datagram)."
  client_reconnecting:
    flag: "-c"
    string: "Reconnecting with saved session..."
  server_resumed:
    flag: "-s"
    string: "key exchange mode: psk_ephemeral"
  client_key_update_sent:
    flag: "-c"
    string: "KeyUpdate sent"
  server_key_update_sent:
    flag: "-s"
    string: "KeyUpdate sent"
  client_key_update_received:
    flag: "-c"
    string: "KeyUpdate received"
  server_key_update_received:
    flag: "-s"
    string: "KeyUpdate received"
  client_key_update_outbound_installed:
    flag: "-c"
