# mbedtls runner profile for DTLS 1.3 test cases.
# Maps abstract case fields to ssl_server2 / ssl_client2 / udp_proxy flags.
# Every field that appears in any cases/*.yaml file must be listed here,
# either with a mapping or with skip: true.
#
# case_glob: exclude interop-* files (those use separate runner profiles)
case_glob: "[!i]*.yaml"

server_cmd: "$P_SRV dtls=1 force_version=dtls13"
client_cmd: "$P_CLI dtls=1 force_version=dtls13"
proxy_cmd:  "$P_PXY"

# Suppress ssl-opt.sh's automatic DTLS proxy insertion for cases that don't
# explicitly request a proxy.  Proxy cases use an explicit proxy: block and
# are unaffected by this default.
default_no_proxy: true

# Overrides for force_version — when the case sets a non-dtls13 force_version,
# the runner replaces the default in server_cmd / client_cmd.
force_version_override: true

param_map:
  dgram_packing:  "dgram_packing={0 if not value else 1}"
  hs_timeout:     "hs_timeout={value[0]}-{value[1]}"
  auth_mode:      "auth_mode={value}"
  nbio:           "nbio={value}"
  debug_level:    "debug_level={value}"
  groups:         "groups={value}"
  mtu:            "mtu={value}"
  exchanges:      "exchanges={value}"
  force_version:  "force_version={value}"
  cookies:        "cookies={value}"
  min_version:    "min_version={value}"
  max_version:    "max_version={value}"
  crt_file:       "crt_file=$DATA_FILES_PATH/{value}"
  key_file:       "key_file=$DATA_FILES_PATH/{value}"
  anti_replay:    "anti_replay={value}"
  psk:            "psk={value}"
  psk_identity:   "psk_identity={value}"
  reconnect:      "reconnect={value}"
  key_update:       "key_update={value}"
  aead_limit:       "aead_limit={value}"
  auth_fail_limit:  "auth_fail_limit={value}"
  cid:              "cid={value}"
  cid_val:          "cid_val={value}"
  send_new_cid:        "send_new_cid={value}"
  request_cid:         "request_cid={value}"
  cid_change_addr:      "cid_change_addr={value}"
  allow_addr_migration: "allow_addr_migration={value}"
  migration_timeout_ms: "migration_timeout_ms={value}"
  skip_close_notify: "skip_close_notify={1 if value else 0}"
  read_timeout:   "read_timeout={value}"
  max_resend:     "max_resend={value}"
  force_ciphersuite: "force_ciphersuite={value}"
  bad_keyupdate:     "bad_keyupdate={value}"
  bad_cookie_on_retry: "bad_cookie_on_retry={value}"
  bad_new_cid:       "bad_new_cid={value}"
  bad_req_cid:       "bad_req_cid={value}"
  double_keyupdate:  "double_keyupdate={1 if value else 0}"
  rotate_cid:        "rotate_cid={value}"

proxy_param_map:
  drop:       "drop={value}"
  delay:      "delay={value}"
  duplicate:  "duplicate={value}"
  bad_ad:     "bad_ad={1 if value else 0}"
  pack:       "pack={value}"
  mtu:        "mtu={value}"

