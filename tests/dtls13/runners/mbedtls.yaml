  client_key_update_inbound_installed:
    flag: "-c"
    string: "KeyUpdate: new inbound transform installed"
  server_key_update_inbound_installed:
    flag: "-s"
    string: "KeyUpdate: new inbound transform installed"
  client_key_update_acked:
    flag: "-c"
    string: "ACK: KeyUpdate acknowledged"
  server_key_update_acked:
    flag: "-s"
    string: "ACK: KeyUpdate acknowledged"
  server_aead_limit_triggered:
    flag: "-s"
    string: "AEAD limit reached"
  client_aead_limit_triggered:
    flag: "-c"
    string: "AEAD limit reached"
  server_auth_fail_limit_reached:
    flag: "-s"
    string: "auth-fail limit reached"
  client_auth_fail_limit_reached:
    flag: "-c"
    string: "auth-fail limit reached"
